<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kho ảnh — LTB Media Network</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="images">
  <header id="site-header"></header>
  <main class="wrap">
    <div class="page-head">
      <div class="eyebrow">Stock Images</div>
      <h1>Kho ảnh có bản quyền</h1>
      <p>Hình ảnh Full HD 1920×1080 đã được đăng ký bản quyền. Liên hệ LTB Media Network để được cấp phép sử dụng.</p>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Tìm theo tên…" aria-label="Tìm kiếm">
      <div class="chips" id="years" aria-label="Lọc theo năm"></div>
    </div>
    <p class="muted" id="count" style="font-size:14px;margin:0 0 14px"></p>
    <div class="grid-images" id="library"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/media.js"></script>
  <script>Media.mountLibrary('image');</script>
</body>
</html>
