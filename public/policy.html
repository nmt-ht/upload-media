<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LTB Media Network</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="policy">
  <header id="site-header"></header>
  <main class="wrap">
    <article class="policy">
      <div class="page-head">
        <div class="eyebrow">Legal</div>
        <h1 id="policy-title"></h1>
        <dl class="policy-meta" id="policy-meta"></dl>
      </div>
      <div class="policy-body" id="policy-body"></div>
    </article>
    <nav class="policy-nav" aria-label="Các chính sách khác">
      <strong>Policies</strong>
      <div class="policy-links" data-policies></div>
    </nav>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { esc } = LTB;
      // "January 1, 2026"
      const MONTHS = 'January February March April May June July August September October November December'.split(' ');
      const fmtLong = (iso) => { const [y, m, d] = iso.split('-').map(Number); return MONTHS[m - 1] + ' ' + d + ', ' + y; };
      const slug = decodeURIComponent(location.pathname.split('/').pop());

      // Định dạng đơn giản cho nội dung admin nhập: dòng trống = đoạn mới, "# " / "## " = tiêu đề,
      // "- " = gạch đầu dòng, "1. " = danh sách số, **chữ đậm**; link và email tự thành liên kết.
      function inline(s) {
        return esc(s)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
          .replace(/(^|[\s(])([\w.+-]+@[\w-]+(\.[\w-]+)+)/g, '$1<a href="mailto:$2">$2</a>');
      }
      function render(text) {
        const out = [];
        let list = null; // { tag, items }
        let para = [];
        const flushPara = () => { if (para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; };
        const flushList = () => { if (list) out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.tag}>`); list = null; };
        for (const raw of text.replace(/\r/g, '').split('\n')) {
          const line = raw.trim();
          let m;
          if (!line) { flushPara(); flushList(); continue; }
          if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
            flushPara(); flushList();
            out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`);
          } else if ((m = line.match(/^(?:[-•*])\s+(.*)$/)) || (m = line.match(/^\d+[.)]\s+(.*)$/))) {
            const tag = /^\d/.test(line) ? 'ol' : 'ul';
            flushPara();
            if (list && list.tag !== tag) flushList();
            list = list || { tag, items: [] };
            list.items.push(m[1]);
          } else {
            flushList();
            para.push(line);
          }
        }
        flushPara(); flushList();
        return out.join('\n');
      }

      const policy = await fetch('/api/policies/' + encodeURIComponent(slug)).then((r) => (r.ok ? r.json() : null));

      if (!policy) {
        document.getElementById('policy-title').textContent = 'Không tìm thấy trang';
        document.getElementById('policy-body').innerHTML = '<p class="muted">Trang chính sách này không tồn tại.</p>';
        return;
      }
      document.title = `${policy.title} — LTB Media Network`;
      document.getElementById('policy-title').textContent = policy.title;
      // Dòng nào admin để trống thì không hiện.
      document.getElementById('policy-meta').innerHTML = [
        ['Effective Date', policy.effectiveDate && fmtLong(policy.effectiveDate)],
        ['Last Updated', policy.updatedAt && fmtLong(policy.updatedAt)],
        ['Operated by', policy.operatedBy],
      ].filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}:</dt> <dd>${esc(v)}</dd></div>`).join('');
      document.getElementById('policy-body').innerHTML = policy.content.trim()
        ? render(policy.content) : '<p class="muted">Nội dung đang được cập nhật.</p>';
    })();
  </script>
</body>
</html>
